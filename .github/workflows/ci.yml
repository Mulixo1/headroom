name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: |
          node --check bin/headroom.mjs
          node --check scripts/install.mjs
          node --check scripts/uninstall.mjs
          node --check src/server/http.js
          node --check src/core/service.js
          node --check src/core/deps.js
      - name: Unit tests
        run: npm test
      - name: CLI help
        run: node bin/headroom.mjs help
      - name: Secret scan (basic)
        run: |
          if rg -n "sk-|oat01|ort01|ghp_|gho_" -g'!.git/**' .; then
            echo "Possible secret found" >&2
            exit 1
          fi
          echo "Secret scan clean"
